name = "nh-dashboard-app"
main = "src/app.js"
compatibility_date = "2026-08-29"
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "nh-dashboard"
database_id = "ed20adc3-f434-4f0a-8832-80862af30201"

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# The class lives in the webhook Worker, so that one has to deploy first.
[[durable_objects.bindings]]
name = "EVENT_LOG"
class_name = "EventLog"
script_name = "nh-dashboard"

# ACCESS_AUD is the Access application's AUD tag. Set it as a secret in the
# Cloudflare dashboard (or `wrangler secret put ACCESS_AUD -c wrangler.app.toml`)
# so it survives deploys. Until it is set, every /api/ request is refused.
#
# GH_APP_PRIVATE_KEY is the same PKCS#8 key the webhook Worker holds. The Verify
# button on the Dream Panel needs it here too; without it the button reports so.
[vars]
GITHUB_ORG = "GTNewHorizons"
# NH-Dashbot. Public: it is in the App's own URL. GH_APP_PRIVATE_KEY is the secret.
GH_APP_ID = "4745300"
ADMIN_TEAM = "admin"
ACCESS_TEAM_DOMAIN = "nh-dashboard.cloudflareaccess.com"
