name = "nh-dashboard-app"
main = "src/app.js"
compatibility_date = "2026-08-29"
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "nh-dashboard"
database_id = "ed20adc3-f434-4f0a-8832-80862af30201"

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# The class lives in the webhook Worker, so that one has to deploy first.
[[durable_objects.bindings]]
name = "EVENT_LOG"
class_name = "EventLog"
script_name = "nh-dashboard"

[[durable_objects.bindings]]
name = "PERMISSIONS"
class_name = "Permissions"
script_name = "nh-dashboard"

# Runs confirmed Permissions page batches with Org-Manager. It lives here rather
# than in the webhook Worker so Org-Manager's key stays in this Worker only.
[[durable_objects.bindings]]
name = "PERMISSION_JOBS"
class_name = "PermissionJobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PermissionJobs"]

# Opens the Updates card's buildscript, Gradle and dependency PRs as Org-Manager.
[[durable_objects.bindings]]
name = "UPDATE_PR_JOBS"
class_name = "UpdatePrJobs"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UpdatePrJobs"]

# Lives in nh-discord-relay, so that one has to deploy first too.
[[durable_objects.bindings]]
name = "DISCORD_RELAY"
class_name = "DiscordRelay"
script_name = "nh-discord-relay"

# ACCESS_AUD is the Access application's AUD tag. Set it as a secret in the
# Cloudflare dashboard (or `wrangler secret put ACCESS_AUD -c wrangler.app.toml`)
# so it survives deploys. Until it is set, every /api/ request is refused.
#
# GH_APP_PRIVATE_KEY is the same PKCS#8 key the webhook Worker holds. The Verify
# button on the Dream Panel needs it here too; without it the button reports so.
#
# ORG_MANAGER_PRIVATE_KEY is Org-Manager's PKCS#8 key, also a secret. The App does
# everything that changes something in the org, starting with releasing a daily.
#
# ORG_OWNER_EMAILS is a secret too: the org owners' Access emails, comma-separated.
# It's how the Permissions page knows who may make owner-only edits; without it
# nobody can.
[vars]
GITHUB_ORG = "GTNewHorizons"
# NH-Dashbot. Public: it is in the App's own URL. GH_APP_PRIVATE_KEY is the secret.
GH_APP_ID = "4745300"
# Org-Manager. Public, like GH_APP_ID.
ORG_MANAGER_APP_ID = "5299242"
ADMIN_TEAM = "admin"
# Team Management's Developers ⇄ Hiatus panels, by team slug.
DEVELOPERS_TEAM = "developers"
HIATUS_TEAM = "developers-on-hiatus"
ACCESS_TEAM_DOMAIN = "nh-dashboard.cloudflareaccess.com"
