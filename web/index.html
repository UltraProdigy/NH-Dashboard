<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH Dashboard</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/sidebar.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/cards.css">
<link rel="stylesheet" href="styles/tables.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/drilldown.css">
<link rel="stylesheet" href="styles/pills.css">
<link rel="stylesheet" href="styles/dream.css">
</head>
<body>

<aside>
  <div class="brand">
    <span class="mark">NH</span>
    <span class="name">NH Dashboard</span>
    <button class="icon-btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.78 3.22a.75.75 0 0 1 0 1.06L6.06 8l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/><path d="M12.25 2.5a.75.75 0 0 1 .75.75v9.5a.75.75 0 0 1-1.5 0v-9.5a.75.75 0 0 1 .75-.75Z"/></svg>
    </button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="side-foot">
    <a id="refresh" target="_blank" rel="noopener" title="Opens the build workflow — 'Run workflow' there rebuilds the data">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.36-.63A6.5 6.5 0 1 1 8 1.5v1.5Z"/><path d="M8 .5 11 3 8 5.5V.5Z"/></svg>
      <span>Refresh data</span>
    </a>
    <button id="theme" title="Switch theme">
      <svg id="themeIcon" viewBox="0 0 16 16" fill="currentColor"></svg>
      <span id="themeLabel">Light mode</span>
    </button>
  </div>
</aside>

<main>
  <div class="topbar">
    <h1 id="pageTitle">…</h1>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="content">
    <div class="toolbar" id="toolbar"></div>
    <div id="view"></div>
  </div>
</main>

<script type="module">
import { CLOSED_LABEL, GRANS, isDrill, state } from "./js/state.js";
import { age, agoText, daysSince, esc, fmt } from "./js/format.js";
import { A, activeWindow, panel, windowKey, windowList } from "./js/data.js";
import { biggestRows, resolvedRows, subject, subjectList, subjectUrl } from "./js/drilldown-data.js";
import { contributorRows } from "./js/contributor-data.js";
import { EXCL_GROUPS, exclPopHtml, isExcludedRow, loadExclusions, panelRows, saveExclusions, updateExclList, visibleLabels } from "./js/dream.js";
import { PAGES } from "./js/pages.js";
import { MODULES } from "./js/modules/index.js";

/* ==========================================================================
   Drilldown data
   --------------------------------------------------------------------------
   drilldown.json is ~2.5 MB and only these two pages need it, so it's fetched
   the first time you land on one and kept for the rest of the session. The
   other three pages never pay for it.
   ========================================================================== */

async function ensureDrilldown() {
  if (state.drillState !== "idle") return;
  state.drillState = "loading";
  render();
  try {
    // The build names the file in dashboard.json rather than the page
    // hardcoding it, so renaming it later can't leave the two out of sync.
    const file = state.data?.panels?.drilldown?.file ?? "drilldown.json";
    const res = await fetch(`data/${file}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.drill = await res.json();
    state.drillState = "ready";
  } catch (err) {
    state.drillState = "error";
    // A build-time failure explains the problem far better than "HTTP 404"
    // does, so prefer it when the panel recorded one.
    state.drillError = state.data?.panels?.drilldown?.error ?? err.message;
  }
  render();
}








/* ==========================================================================
   Counts on tabs
   ========================================================================== */

function moduleCount(id) {
  const m = MODULES[id];
  if (m.panelId) {
    const p = panel(m.panelId);
    if (!p?.ok) return "!";
    // Counts follow the exclusions — a tab badge that disagrees with the list
    // underneath it is worse than no badge.
    return m.panelId === "byLabel"
      ? visibleLabels().reduce(
          (n, k) => n + (p.data[k] ?? []).filter(r => !isExcludedRow(r)).length, 0)
      : panelRows(m.panelId).length;
  }
  if (id === "leaderboard") return contributorRows().length;
  if (id === "backlog") return A()?.backlog?.total ?? null;
  // Null until a subject is picked, which is also when the tabs mean anything.
  if (id === "cOpenPRs" || id === "rBacklog") return subject()?.backlog?.total ?? null;
  if (id === "cClosed") return subject() ? resolvedRows().length : null;
  if (id === "cBiggest") return subject() ? biggestRows().length : null;
  return null;
}

/* ==========================================================================
   Rendering
   ========================================================================== */

const currentPage = () => PAGES.find(p => p.id === state.page) ?? PAGES[0];

function renderSidebar() {
  document.getElementById("pages").innerHTML = PAGES.map(p => `
    <button data-page="${p.id}" aria-current="${p.id === state.page}" title="${esc(p.label)}">
      <svg viewBox="0 0 16 16" fill="currentColor">${p.icon}</svg>
      <span class="plabel">${esc(p.label)}</span>
    </button>`).join("");
}

function renderTabs() {
  const page = currentPage();
  document.getElementById("pageTitle").textContent = page.label;
  document.getElementById("tabs").innerHTML =
    `<button data-module="" aria-selected="${state.module === null}">Overview</button>` +
    page.modules.map(id => {
      const c = moduleCount(id);
      return `<button data-module="${id}" aria-selected="${state.module === id}">${esc(MODULES[id].label)}${
        c == null ? "" : `<span class="count">${typeof c === "number" ? fmt(c) : c}</span>`}</button>`;
    }).join("");
}

/* ---- the search-and-select popup ---------------------------------------- */

/**
 * Filtered subjects for the popup. The index is pre-sorted by activity, and
 * `sort` is stable, so promoting prefix matches keeps the busiest first within
 * each group — typing "gt" puts GT5-Unofficial above a fork with "gt" buried
 * in the middle of its name.
 */
function comboOptions() {
  const q = state.combo.q.trim().toLowerCase();
  const list = subjectList();
  if (!q) return list.slice(0, 60);

  const hits = [];
  for (const r of list) {
    const i = r.id.toLowerCase().indexOf(q);
    if (i !== -1) hits.push({ ...r, i });
  }
  return hits.sort((a, b) => (a.i === 0 ? 0 : 1) - (b.i === 0 ? 0 : 1)).slice(0, 60);
}

function comboPopHtml() {
  const opts = comboOptions();
  const what = state.page === "contributor" ? "contributor" : "repo";
  if (!opts.length)
    return `<div class="combo-none">No ${what} matching “${esc(state.combo.q)}”.</div>`;

  const q = state.combo.q.trim().toLowerCase();
  return opts.map((o, i) => {
    const at = q ? o.id.toLowerCase().indexOf(q) : -1;
    const name = at === -1 ? esc(o.id)
      : esc(o.id.slice(0, at)) + `<mark>${esc(o.id.slice(at, at + q.length))}</mark>` +
        esc(o.id.slice(at + q.length));
    // Last active, not volume. The totals were already visible on the profile
    // you're about to open; recency is the thing that tells you whether this
    // is the person you meant before you commit to the click.
    //
    // The list is still ranked by total activity — when you type "dre" you
    // want Dream-Master first, not whoever pushed most recently.
    const meta = `Active: ${esc(agoText(daysSince(o.last)))}`;
    return `<div class="combo-opt" role="option" data-pick="${esc(o.id)}"
      aria-selected="${i === state.combo.active}"><span class="n">${name}</span><span class="c">${meta}</span></div>`;
  }).join("");
}

/**
 * Repaint just the popup. Typing must not go through render() — that would
 * redraw every chart on the page on each keystroke.
 */
function updateComboPop() {
  const pop = document.getElementById("comboPop");
  if (!pop) return;
  pop.hidden = !state.combo.open;
  pop.innerHTML = state.combo.open ? comboPopHtml() : "";
  document.getElementById("comboInput")?.setAttribute("aria-expanded", String(state.combo.open));
  if (state.combo.open)
    pop.querySelector('.combo-opt[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
}

function closeCombo() {
  state.combo.open = false;
  state.combo.q = "";
  state.combo.active = 0;
}

/**
 * Toolbar is per-view: the overview shows whatever its page needs globally,
 * a module tab shows only the controls that module declares.
 */
function renderToolbar() {
  const page = currentPage();
  const mod = state.module ? MODULES[state.module] : null;
  // On a module's own tab it gets everything it asks for. On the overview only
  // `controls` are gathered — `tabControls` are ones that would be clutter
  // floating above a grid of cards they only affect one of.
  const wanted = new Set(
    mod
      ? [...(mod.controls ?? []), ...(mod.tabControls ?? [])]
      : page.modules.flatMap(id => MODULES[id].controls ?? [])
  );
  // Window applies to nearly everything on the org pages. The drilldowns
  // instead let each module declare it, so a tab that ignores the window —
  // all-time Collaboration, the open-PR list — doesn't display a control that
  // changes nothing when you touch it.
  if (!isDrill(page.id) && page.id !== "dream") wanted.add("window");
  if (mod?.panelId || ["leaderboard", "newcomers", "lapsed", "backlog", "cOpenPRs", "rBacklog", "cClosed", "cBiggest", "actions"].includes(state.module) ||
      page.id === "dream") wanted.add("filter");
  // Page-wide on Dream: it hides rows from every card, so it belongs up here
  // rather than on any one of them.
  if (page.id === "dream") wanted.add("excl");
  // The subject picker is the whole point of a drilldown page, so it's always
  // there — including before anything is selected, which is when it's needed.
  if (isDrill(page.id)) wanted.add("subject");

  const bits = [];

  if (wanted.has("subject")) {
    const what = state.page === "contributor" ? "contributors" : "repos";
    bits.push(`<span class="combo" id="combo">
      <input type="search" id="comboInput" role="combobox" aria-expanded="${state.combo.open}"
             aria-autocomplete="list" aria-controls="comboPop" autocomplete="off"
             placeholder="Search ${what}…"
             value="${esc(state.combo.open ? state.combo.q : (state.subject ?? ""))}">
      <div class="combo-pop" id="comboPop" role="listbox"${state.combo.open ? "" : " hidden"}>${
        state.combo.open ? comboPopHtml() : ""}</div>
    </span>`);
    // Routes through the same go() the sidebar uses, so the toggle and the
    // sidebar highlight cannot disagree about which mode you're in.
    bits.push(`<span class="seg" id="modeSeg">${
      ["contributor", "repo"].map(m =>
        `<button data-mode="${m}" aria-pressed="${state.page === m}">${m === "contributor" ? "Contributor" : "Repo"}</button>`
      ).join("")}</span>`);
  }

  if (wanted.has("filter"))
    bits.push(`<input type="search" id="filter" placeholder="Filter by repo, title, or author…" value="${esc(state.filter)}">`);

  if (wanted.has("window")) {
    const ws = windowList();
    const cur = activeWindow();
    // The same segmented control on every page. It used to be a dropdown here
    // and a segmented control on the drilldowns, with a *second* range picker
    // beside it driving the charts — two time controls on one toolbar,
    // answering subtly different questions about the same page. One control,
    // one shape, scoping the numbers and the charts together.
    // Labelled for the same reason the x-axis control is: "3m" and "by month"
    // are both short strings of time next to each other, and which one is the
    // range and which one is the bucket size isn't guessable from the buttons.
    bits.push(`<span class="minlabel">period
      <span class="seg" id="windowSeg">${ws.map(w =>
        `<button data-window="${w.id}" aria-pressed="${w.id === cur}" title="${esc(w.label)}">${
          esc(w.short ?? w.label)}</button>`).join("")}</span></span>`);
  }

  // Granularity is not a time range — it's what one bar means — so it keeps
  // its own control, labelled the way the window control used to be so it's
  // obvious the two aren't the same kind of thing.
  if (wanted.has("gran"))
    bits.push(`<span class="minlabel">x-axis
      <span class="seg" id="granSeg">${GRANS.map(g =>
        `<button data-gran="${g.id}" aria-pressed="${state.gran === g.id}">${esc(g.label)}</button>`).join("")}</span></span>`);

  // One button per kind. "Exclusions ▾" hid two unrelated decisions behind one
  // control and gave no clue from the toolbar whether what was hidden was a
  // repo or a label — the count was the sum of both.
  if (wanted.has("excl")) {
    for (const g of EXCL_GROUPS) {
      const open = state.exclOpen === g.kind;
      const n = state.dreamExcl[g.kind].length;
      bits.push(`<span class="combo excl-wrap" data-exclgroup="${g.kind}">
        <button class="ghost excl-btn" data-exclbtn="${g.kind}" aria-expanded="${open}">
          ${esc(g.label)}${n ? ` <span class="count">${n}</span>` : ""} ▾
        </button>
        <div class="combo-pop excl-pop"${open ? "" : " hidden"}>${
          open ? exclPopHtml(g.kind) : ""}</div>
      </span>`);
    }
  }

  if (wanted.has("closedState"))
    bits.push(`<span class="seg" id="closedSeg">${
      Object.entries(CLOSED_LABEL).map(([id, label]) =>
        `<button data-closed="${id}" aria-pressed="${state.closedState === id}">${esc(label)}</button>`
      ).join("")}</span>`);

  if (wanted.has("minActivity"))
    bits.push(`<label class="minlabel">min activity <input type="number" id="minActivity" min="0" step="1" value="${state.minActivity}"></label>`);

  const tb = document.getElementById("toolbar");
  tb.innerHTML = bits.join("");
  tb.style.display = bits.length ? "" : "none";

  // A render triggered while the popup is open (changing the window picker,
  // say) rebuilds the input and drops the caret. Put it back.
  if (state.combo.open) {
    const c = document.getElementById("comboInput");
    if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }
}

/**
 * The line beside a card's title. Usually descriptive text; a module can hand
 * back markup instead when the thing that describes the card *is* a control —
 * By label, whose picker is the only sensible caption for it.
 */
const cardSub = (m) =>
  m.subHtml ? m.subHtml() : `<span class="sub">${esc(m.sub ? m.sub() : "")}</span>`;

function card(id) {
  const m = MODULES[id];
  let body;
  try { body = m.render(false); }
  catch (err) { body = `<div class="error">${esc(err.message)}</div>`; }
  // `fill` only on the overview: here the card is stretched by its row and the
  // list should take up the slack. In the expanded view the card stands alone,
  // so an unbounded list would just make the page metres long — there the
  // module's own max-height applies.
  return `<section class="card" style="--span:${m.span}">
    <header>
      <h2>${esc(m.label)}</h2>
      ${cardSub(m)}
      <button class="expand" data-open="${id}">Expand ↗</button>
    </header>
    <div class="body${m.flush ? " flush" : ""}${m.fill ? " fill" : ""}">${body}</div>
  </section>`;
}

/** Overview grid, or the one selected module full-width. */
function pageBody() {
  if (state.module === null)
    return `<div class="grid">${currentPage().modules.map(card).join("")}</div>`;

  const m = MODULES[state.module];
  let body;
  try { body = m.render(true); }
  catch (err) { body = `<div class="error">${esc(err.message)}</div>`; }
  return `<section class="card" style="--span:12">
    <header><h2>${esc(m.label)}</h2>${cardSub(m)}</header>
    <div class="body${m.flush ? " flush" : ""}">${body}</div>
  </section>`;
}

/** Nothing selected yet — offer the busiest subjects as a starting point. */
function pickerHtml() {
  const what = state.page === "contributor" ? "contributor" : "repo";
  const missing = state.subject && !subject();
  return `<div class="picker">
    ${missing ? `<div class="error" style="padding:0 0 22px">Nothing named “${esc(state.subject)}” in the ingested data. It may be a bot, or a repo with no pull requests.</div>` : ""}
    <h3>Pick a ${what}</h3>
    <p>Search above, or jump straight to one of the busiest.</p>
    <div class="chips">${subjectList().slice(0, 24).map(o =>
      `<button data-pick="${esc(o.id)}">${esc(o.id)}</button>`).join("")}</div>
  </div>`;
}

function renderDrill(view) {
  // Kicked off lazily on first visit; ensureDrilldown re-renders as it goes.
  if (state.drillState === "idle") return void ensureDrilldown();

  if (state.drillState === "loading") {
    view.innerHTML = `<div class="loading">Loading drilldown data…</div>`;
    return;
  }
  if (state.drillState === "error") {
    view.innerHTML = `<div class="error">Drilldown data unavailable — ${esc(state.drillError)}.<br><br>
      It's built from the local PR store: run <code>npm run ingest</code> then <code>npm run build</code> to generate <code>data/drilldown.json</code>.</div>`;
    return;
  }
  if (!state.subject || !subject()) {
    view.innerHTML = pickerHtml();
    return;
  }

  const s = subject();
  const head = `<div class="subject">
    <h2>${esc(state.subject)}</h2>
    <a class="ghost" href="${subjectUrl(state.subject)}" target="_blank" rel="noopener">View on GitHub ↗</a>
    <span class="dates">${fmt(s.totalPRs)} PRs${
      state.page === "contributor" ? " authored" : ""} · first ${
      s.first ? esc(s.first.slice(0, 10)) : "—"} · last active ${age(daysSince(s.last))}</span>
  </div>`;

  view.innerHTML = head + pageBody();
}

function render() {
  renderSidebar();
  renderTabs();
  renderToolbar();

  const view = document.getElementById("view");
  if (!state.data) return;

  if (isDrill(state.page)) return renderDrill(view);
  view.innerHTML = pageBody();
}

/* ==========================================================================
   Routing — hash keeps deep links shareable and survives a reload
   ========================================================================== */

/**
 * Two shapes, because drilldown pages carry a subject:
 *
 *   #people/newcomers
 *   #contributor/Dream-Master/cActivity
 *
 * Logins and repo names can't contain a slash, so splitting on it is safe;
 * they're still percent-encoded, since they can contain plenty else.
 */
/**
 * `_` is the placeholder for "a tab is selected but no subject is". It only
 * shows up when you flip modes with a tab open, and it exists so the subject
 * always sits in the same slot — without it, `#repo/rActivity` would be
 * indistinguishable from a repo that happens to be named rActivity.
 */
const NO_SUBJECT = "_";

/**
 * Where you last were on each page, so the sidebar and the mode toggle put you
 * back rather than resetting to Overview with nothing selected.
 *
 * In memory only. The hash stays the source of truth, so a reload or a shared
 * link still lands exactly where the URL says — this only fills in the blanks
 * when a navigation doesn't specify them.
 */
const lastPlace = Object.create(null);

const remember = () => {
  lastPlace[state.page] = { module: state.module, subject: state.subject };
};

function readHash() {
  const parts = location.hash.replace(/^#/, "").split("/");
  const page = parts[0];
  if (PAGES.some(p => p.id === page)) state.page = page;

  const drill = isDrill(state.page);
  state.subject =
    drill && parts[1] && parts[1] !== NO_SUBJECT ? decodeURIComponent(parts[1]) : null;

  const mod = parts[drill ? 2 : 1];
  state.module = mod && MODULES[mod]?.page === state.page ? mod : null;
  remember();
}

/**
 * `subject` left off means "decide for me": keep it when staying on the same
 * drilldown page (switching tabs), drop it otherwise — a login is not a repo
 * name, so carrying one across a mode switch would only ever 404.
 */
function go(page, mod = null, subject) {
  const drill = isDrill(page);
  if (subject === undefined)
    subject = drill && page === state.page ? state.subject : null;

  state.page = page;
  state.module = mod;
  state.subject = drill ? subject : null;
  state.sort = null;
  state.filter = "";
  closeCombo();
  remember();

  if (drill) {
    const seg = [page];
    if (subject) seg.push(encodeURIComponent(subject));
    else if (mod) seg.push(NO_SUBJECT);
    if (mod) seg.push(mod);
    location.hash = seg.join("/");
  } else {
    location.hash = mod ? `${page}/${mod}` : page;
  }
  render();
}

/** Jump into a drilldown from anywhere, including the other drilldown page. */
function drillTo(page, id) {
  go(page, null, id);
}

/** Sidebar and mode-toggle navigation: resume rather than reset. */
function goPage(page, fallbackModule = null) {
  const last = lastPlace[page];
  go(page, last?.module ?? fallbackModule, last?.subject ?? null);
}

/* ==========================================================================
   Events
   ========================================================================== */

document.getElementById("pages").addEventListener("click", e => {
  const b = e.target.closest("button[data-page]");
  if (b) goPage(b.dataset.page);
});

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-module]");
  if (b) go(state.page, b.dataset.module || null);
});

document.getElementById("view").addEventListener("click", e => {
  // Contributor names are real anchors to #contributor/<login>, so the browser
  // handles middle-click and cmd-click natively. Plain clicks are intercepted
  // only so they route through go(), which clears the sort and filter the way
  // every other navigation does — letting the hash change on its own would
  // carry a stale filter onto the new subject.
  const link = e.target.closest("a[data-drilllink]");
  if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    const [page, subj] = link.getAttribute("href").slice(1).split("/");
    return drillTo(page, decodeURIComponent(subj));
  }

  const pick = e.target.closest("[data-pick]");
  if (pick) return drillTo(state.page, pick.dataset.pick);

  const open = e.target.closest("button[data-open]");
  if (open) return go(state.page, open.dataset.open);

  const th = e.target.closest("th[data-sort]");
  if (th) {
    state.dir = state.sort === th.dataset.sort ? -state.dir : -1;
    state.sort = th.dataset.sort;
    render();
  }
});

/* The By-label picker lives in that card's header rather than the toolbar, so
   its events arrive here. */
document.getElementById("view").addEventListener("change", e => {
  if (e.target.id !== "labelPicker") return;
  state.label = e.target.value;
  state.sort = null;
  render();
});

document.getElementById("toolbar").addEventListener("input", e => {
  const t = e.target;
  // Typing in the combobox repaints only the popup. Routing it through
  // render() would redraw every chart on the page on every keystroke.
  if (t.id === "comboInput") {
    state.combo.q = t.value;
    state.combo.open = true;
    state.combo.active = 0;
    return updateComboPop();
  }
  // Typing in an exclusion search repaints only that list, for the same reason
  // the combobox does: render() would rebuild the toolbar and drop the caret.
  if (t.dataset?.exclq) {
    state.exclQ[t.dataset.exclq] = t.value;
    return updateExclList(t.dataset.exclq);
  }
  if (t.id === "filter") state.filter = t.value.trim();
  else if (t.id === "minActivity") {
    const v = Number(t.value);
    state.minActivity = Number.isFinite(v) && v >= 0 ? v : 0;
  } else return;
  render();
  // Re-focus the text box: render() replaces the toolbar wholesale, which
  // would otherwise drop the caret after every keystroke.
  if (t.id === "filter") {
    const f = document.getElementById("filter");
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
});

document.getElementById("toolbar").addEventListener("click", e => {
  const opt = e.target.closest(".combo-opt[data-pick]");
  if (opt) return drillTo(state.page, opt.dataset.pick);

  const mode = e.target.closest("button[data-mode]");
  if (mode && mode.dataset.mode !== state.page) {
    // Resume the other mode where you left it. Only if you've never been
    // there does it fall back to the equivalent tab, so flipping between a
    // repo and a person doesn't bounce you to Overview either way.
    const twin = state.module ? MODULES[state.module].twin ?? null : null;
    return goPage(mode.dataset.mode, twin);
  }

  // One control, several homes for its value: the drilldowns keep their own
  // period so looking at a person doesn't reset what Analytics was showing, and
  // New Faces keeps its own so it can default to a shorter span than its page.
  const w = e.target.closest("button[data-window]");
  if (w) {
    state[windowKey()] = w.dataset.window;
    return render();
  }

  const cs = e.target.closest("button[data-closed]");
  if (cs) { state.closedState = cs.dataset.closed; return render(); }

  const g = e.target.closest("button[data-gran]");
  if (g) { state.gran = g.dataset.gran; return render(); }

  /* ---- exclusions ---- */
  const eb = e.target.closest("button[data-exclbtn]");
  if (eb) {
    // Stopped here rather than left to bubble: the document-level
    // close-on-outside-click handler would otherwise see this same click
    // *after* render() has torn the button out of the DOM, and decide it
    // landed outside the popup it just opened.
    e.stopPropagation();
    // Opening one closes the other. Two popups side by side would overlap, and
    // there's no reason to consult both at once.
    state.exclOpen = state.exclOpen === eb.dataset.exclbtn ? null : eb.dataset.exclbtn;
    return render();
  }
  const ec = e.target.closest("button[data-exclclear]");
  if (ec) {
    // Scoped to its own group: "Clear" inside the Repos popup should not
    // silently un-hide every label as well.
    state.dreamExcl[ec.dataset.exclclear] = [];
    saveExclusions();
    return render();
  }
});

/**
 * Ticking a box repaints the whole page — every card on Dream reads the
 * exclusions — but the popup has to stay open, since the point of a
 * multi-select is picking several without reopening it each time.
 */
document.getElementById("toolbar").addEventListener("change", e => {
  const box = e.target.closest("input[data-excl]");
  if (!box) return;
  const list = state.dreamExcl[box.dataset.excl];
  const i = list.indexOf(box.value);
  if (box.checked) { if (i === -1) list.push(box.value); }
  else if (i !== -1) list.splice(i, 1);
  saveExclusions();
  // render() rebuilds the popup from scratch; put the list's scroll position
  // back so ticking the fortieth repo doesn't fling you to the top.
  const kind = box.dataset.excl;
  const top = document.getElementById(`exclList-${kind}`)?.scrollTop ?? 0;
  render();
  const fresh = document.getElementById(`exclList-${kind}`);
  if (fresh) fresh.scrollTop = top;
});

/* Combobox keyboard handling. Kept on the toolbar rather than the input
   because render() replaces the input element wholesale. */
document.getElementById("toolbar").addEventListener("keydown", e => {
  if (e.target.id !== "comboInput") return;

  if (e.key === "Escape") {
    closeCombo();
    updateComboPop();
    e.target.value = state.subject ?? "";
    return;
  }

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!state.combo.open) {
      state.combo.open = true;
      state.combo.active = 0;
      return updateComboPop();
    }
    const n = comboOptions().length;
    if (!n) return;
    state.combo.active =
      (state.combo.active + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
    return updateComboPop();
  }

  if (e.key === "Enter") {
    e.preventDefault();
    const pick = state.combo.open ? comboOptions()[state.combo.active] : null;
    if (pick) drillTo(state.page, pick.id);
  }
});

document.getElementById("toolbar").addEventListener("focusin", e => {
  if (e.target.id !== "comboInput") return;
  state.combo.open = true;
  state.combo.q = "";
  // Emptied rather than selected: select-all only survives until the first
  // click lands, and typing after that would append to the current subject's
  // name instead of starting a fresh query. The name is still in the header.
  e.target.value = "";
  updateComboPop();
});

/* Close on an outside click rather than on blur: blur fires before click, so a
   blur handler would tear the popup down before the option got selected. */
document.addEventListener("click", e => {
  // Closes when the click lands outside *the open group's* wrapper — clicking
  // the other exclusion button counts as outside, and its own handler opens it.
  if (state.exclOpen &&
      e.target.closest(".excl-wrap")?.dataset.exclgroup !== state.exclOpen) {
    state.exclOpen = null;
    render();
  }
  if (!state.combo.open || e.target.closest("#combo")) return;
  closeCombo();
  updateComboPop();
  // Put the current subject back — the box was cleared on focus.
  const c = document.getElementById("comboInput");
  if (c) c.value = state.subject ?? "";
});

const collapseBtn = document.getElementById("collapse");
collapseBtn.addEventListener("click", () => {
  const c = document.body.classList.toggle("collapsed");
  localStorage.setItem("nh:collapsed", c ? "1" : "0");
  collapseBtn.title = c ? "Expand sidebar" : "Collapse sidebar";
});

/* ---- theme ---------------------------------------------------------------
   Nothing to do with GitHub — this is the dashboard's own setting, defaulting
   to whatever the OS asks for and remembered once you override it. */
const SUN = `<circle cx="8" cy="8" r="3.2"/><path d="M8 0a.7.7 0 0 1 .7.7v1.4a.7.7 0 0 1-1.4 0V.7A.7.7 0 0 1 8 0Zm0 13.2a.7.7 0 0 1 .7.7v1.4a.7.7 0 0 1-1.4 0v-1.4a.7.7 0 0 1 .7-.7ZM16 8a.7.7 0 0 1-.7.7h-1.4a.7.7 0 0 1 0-1.4h1.4A.7.7 0 0 1 16 8ZM2.8 8a.7.7 0 0 1-.7.7H.7a.7.7 0 0 1 0-1.4h1.4a.7.7 0 0 1 .7.7Zm10.85-5.65a.7.7 0 0 1 0 1L12.66 4.3a.7.7 0 1 1-1-1l1-1a.7.7 0 0 1 1 0ZM4.34 11.66a.7.7 0 0 1 0 1l-1 1a.7.7 0 1 1-1-1l1-1a.7.7 0 0 1 1 0Zm9.31 2a.7.7 0 0 1-1 0l-1-1a.7.7 0 1 1 1-1l1 1a.7.7 0 0 1 0 1ZM4.34 4.34a.7.7 0 0 1-1 0l-1-1a.7.7 0 0 1 1-1l1 1a.7.7 0 0 1 0 1Z"/>`;
const MOON = `<path d="M9.9 1.3a6.7 6.7 0 1 0 4.9 8.2 5.5 5.5 0 0 1-4.9-8.2Z"/>`;

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById("themeIcon").innerHTML = t === "dark" ? SUN : MOON;
  document.getElementById("themeLabel").textContent = t === "dark" ? "Light mode" : "Dark mode";
  document.getElementById("theme").title = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
}

document.getElementById("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("nh:theme", next);
  applyTheme(next);
});

window.addEventListener("hashchange", () => { readHash(); render(); });

/* ==========================================================================
   Boot
   ========================================================================== */

if (localStorage.getItem("nh:collapsed") === "1") {
  document.body.classList.add("collapsed");
  collapseBtn.title = "Expand sidebar";
}

const prefersLight =
  typeof window.matchMedia === "function" &&
  window.matchMedia("(prefers-color-scheme: light)").matches;
applyTheme(localStorage.getItem("nh:theme") ?? (prefersLight ? "light" : "dark"));

try {
  // Relative, not absolute: on GitHub Pages this lives under /NH-Dashboard/,
  // so a leading slash would resolve to the wrong origin root.
  const res = await fetch("data/dashboard.json", { cache: "no-store" });
  if (!res.ok) throw new Error("no data yet");
  state.data = await res.json();

  const built = new Date(state.data.generatedAt);
  const mins = Math.round((Date.now() - built) / 60000);
  const ageText = mins < 1 ? "just now" : mins < 90 ? `${mins} min ago` : `${Math.round(mins / 60)} hr ago`;
  const meta = document.getElementById("meta");
  meta.textContent = `${state.data.org} · built ${ageText}`;
  // Flag it visually once the data is older than a couple of cron cycles,
  // which usually means a workflow run failed rather than just ran late.
  if (mins > 90) meta.classList.add("stale");

  // Derive the workflow URL from wherever this is hosted, so a fork or a
  // move into the org doesn't need this hardcoded value updated.
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = m ? `${m[1]}/${location.pathname.split("/").filter(Boolean)[0] ?? ""}` : null;
  document.getElementById("refresh").href = repo
    ? `https://github.com/${repo}/actions/workflows/build.yml`
    : "https://github.com/UltraProdigy/NH-Dashboard/actions/workflows/build.yml";

  state.label = Object.keys(state.data.panels.byLabel?.data ?? {})[0] ?? null;
  loadExclusions();
  readHash();
  render();
} catch (err) {
  document.getElementById("meta").textContent = "no data";
  document.getElementById("view").innerHTML =
    `<div class="error">No data found. Run <code>npm run build</code> first.</div>`;
}
</script>
</body>
</html>
