<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --purple: #bc8cff;
    --pink: #f778ba;
    --sidebar-w: 232px;
    --rail-w: 56px;
  }
  /* Explicit rather than a prefers-color-scheme media query: the toggle has to
     be able to override the OS, and a media query would fight it. The initial
     value is picked from the OS in script, then remembered. */
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --panel-2: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #59636e;
    --accent: #0969da;
    --good: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
    --purple: #8250df;
    --pink: #bf3989;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* min-height, NOT height. `height: 100%` caps the body box at one viewport
       even when the content overflows it, which makes the grid row exactly
       100vh tall — and a sticky child can never travel outside its containing
       block, so the sidebar scrolled away with the page. Letting the body grow
       to its content is what gives sticky room to work. */
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    transition: grid-template-columns .16s ease;
  }
  body.collapsed { grid-template-columns: var(--rail-w) minmax(0, 1fr); }

  /* ---------- sidebar ---------- */
  aside {
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    /* `align-self: start` matters: a grid item defaults to stretching to the
       full row height, which leaves sticky nothing to slide against. Pinning
       it to the top and capping it at the viewport is what makes the nav
       follow you down a long page. */
    align-self: start;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 14px;
    border-bottom: 1px solid var(--border);
    min-height: 57px;
  }
  .brand .mark {
    width: 26px; height: 26px; flex: none;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #0d1117;
  }
  .brand .name { font-weight: 600; white-space: nowrap; }
  body.collapsed .brand .name,
  body.collapsed .brand .mark { display: none; }
  body.collapsed .brand { justify-content: center; }

  .icon-btn {
    margin-left: auto;
    display: grid; place-items: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--muted);
    padding: 5px;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  body.collapsed .icon-btn { margin-left: 0; }
  body.collapsed .icon-btn svg { transform: rotate(180deg); }

  .pages { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .pages button {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    background: none; border: none; border-radius: 7px;
    color: var(--muted);
    padding: 9px 10px;
    font: inherit; text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .pages button:hover { background: var(--panel-2); color: var(--text); }
  .pages button[aria-current="true"] {
    background: var(--panel-2);
    color: var(--text);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .pages svg { flex: none; width: 17px; height: 17px; opacity: .85; }
  body.collapsed .pages button { justify-content: center; padding: 9px 0; }
  body.collapsed .pages .plabel { display: none; }

  .side-foot { margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--border); }
  .side-foot button, .side-foot a {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    background: none; border: none; border-radius: 7px;
    color: var(--muted); padding: 9px 10px;
    font: inherit; cursor: pointer; text-decoration: none;
    white-space: nowrap;
  }
  .side-foot button:hover, .side-foot a:hover { background: var(--panel-2); color: var(--text); }
  .side-foot svg { flex: none; width: 17px; height: 17px; }
  body.collapsed .side-foot button, body.collapsed .side-foot a { justify-content: center; padding: 9px 0; }
  body.collapsed .side-foot span { display: none; }

  /* ---------- main column ---------- */
  main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 24px;
    min-height: 57px;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta.stale { color: var(--warn); }
  .spacer { margin-left: auto; }

  nav.tabs {
    display: flex; gap: 2px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  nav.tabs button {
    background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 11px 12px;
    font: inherit; cursor: pointer; white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button[aria-selected="true"] {
    color: var(--text);
    border-bottom-color: #f78166;
  }
  .count {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 6px; margin-left: 6px;
    font-size: 11px; font-variant-numeric: tabular-nums;
  }

  .content { padding: 20px 24px 60px; }

  /* ---------- controls ---------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  input[type="search"], select, input[type="number"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
  }
  input[type="search"] { min-width: 260px; }
  input[type="number"] { width: 72px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--panel); border: none; color: var(--muted);
    padding: 6px 11px; font: inherit; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  .seg button:hover { color: var(--text); }
  .ghost {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 11px; font-size: 12px; color: var(--text);
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .ghost:hover { border-color: var(--accent); text-decoration: none; }
  .minlabel { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }

  /* ---------- module grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .card {
    grid-column: span var(--span, 6);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .card > header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 12px; }
  .card .body { padding: 14px; min-width: 0; flex: 1; }
  .card .body.flush { padding: 0; }
  .expand {
    margin-left: auto;
    background: none; border: 1px solid transparent; border-radius: 6px;
    color: var(--muted); cursor: pointer;
    padding: 3px 7px; font: inherit; font-size: 11px;
  }
  .card:hover .expand { border-color: var(--border); }
  .expand:hover { color: var(--text); background: var(--panel-2); }
  @media (max-width: 1080px) { .card { grid-column: span 12 !important; } }

  /* ---------- kpis ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); }
  .kpi { background: var(--panel); padding: 14px; min-width: 0; }
  .kpi .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .kpi .d { font-size: 12px; color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    color: var(--muted); font-weight: 500; font-size: 12px;
    cursor: pointer; user-select: none;
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  th:hover { color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .repo { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .label { display: inline-block; border-radius: 10px; padding: 0 7px; font-size: 11px; margin: 1px 3px 1px 0; border: 1px solid var(--border); }
  .age-old { color: var(--warn); }
  .age-ancient { color: var(--bad); }
  .more { padding: 9px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .empty, .error { color: var(--muted); padding: 32px 0; text-align: center; font-size: 13px; }
  .error { color: var(--bad); }

  /* ---------- charts ---------- */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
  svg.chart { display: block; width: 100%; overflow: visible; }
  svg.chart .grid-line { stroke: var(--border); stroke-width: 1; }
  svg.chart .axis { fill: var(--muted); font-size: 10px; }
  svg.chart .hoverzone:hover { fill: color-mix(in srgb, var(--text) 7%, transparent); }

  .hbars { display: flex; flex-direction: column; gap: 7px; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
  .hbar .track { background: var(--panel-2); border-radius: 3px; height: 9px; overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 3px; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Inside a paired box the name is the thing you're reading and the bar is
     just a sense of scale, so the split is inverted from the wide cards: the
     label takes whatever's left and the track is capped at a third. At 34% a
     repo name in a half-width box ellipsised after twelve characters while a
     bar sat in acres of empty panel beside it. */
  .duo-box .hbar { grid-template-columns: minmax(0, 1fr) minmax(44px, 32%) auto; }
  .hbar .val { color: var(--muted); font-variant-numeric: tabular-nums; }

  .heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); }
  .heat .cell { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); }
  .heat .rl { display: flex; align-items: center; }
  .heat .cl { text-align: center; }

  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ---------- drilldown: search-and-select ---------- */
  /* Hand-rolled rather than a <datalist>: 1,200 options make the native popup
     sluggish, it can't show the activity counts that make the right person
     obvious, and its styling is untouchable. */
  .combo { position: relative; }
  .combo input { min-width: 280px; }
  .combo-pop {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0;
    min-width: 320px; max-height: 320px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.28);
    scrollbar-width: thin;
  }
  :root[data-theme="light"] .combo-pop { box-shadow: 0 8px 24px rgba(31,35,40,.12); }
  .combo-pop[hidden] { display: none; }
  .combo-opt {
    display: flex; align-items: baseline; gap: 8px;
    padding: 7px 11px; cursor: pointer; white-space: nowrap;
  }
  .combo-opt .n { overflow: hidden; text-overflow: ellipsis; }
  .combo-opt .c { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .combo-opt[aria-selected="true"] { background: var(--panel-2); }
  .combo-opt mark { background: none; color: var(--accent); font-weight: 600; }
  .combo-none { padding: 12px; color: var(--muted); font-size: 12px; }

  /* ---------- drilldown: subject header ---------- */
  .subject { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .subject h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .subject .dates { color: var(--muted); font-size: 12px; }
  /* ---------- drilldown: paired stat boxes ---------- */
  /* Two related rankings read as a comparison when they're side by side and as
     a sequence when they're stacked. These are comparisons. */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }
  /* Same two boxes, one above the other. A 4-column overview card is too
     narrow to put two ranked lists beside each other — the repo names ellipsis
     down to nothing — so it stacks there and pairs up in the expanded view,
     where there's a full 12 columns to spend. Explicit rows rather than `auto`:
     inside a `fill` body the pair has to split the height it's given, not ask
     for the height its content wants. */
  .duo.stacked { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .duo-box {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2);
    display: flex; flex-direction: column; min-width: 0;
  }
  .duo-box > h3 {
    margin: 0; padding: 9px 12px;
    font-size: 12px; font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 8px;
  }
  .duo-box > h3 .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11px; }
  .duo-box > .scroll { padding: 11px 12px; flex: 1; min-height: 0; }

  /* Lists are uncapped now, so long ones scroll inside their box instead of
     making the page metres tall. */
  .scroll { overflow-y: auto; scrollbar-width: thin; }
  .scroll.tall { max-height: 620px; }
  .scroll.short { max-height: 260px; }

  /* A list card should take its height *from* the chart beside it, never give
     height to the row. Flexbox can't do that: a flex child still reports its
     content size to the grid, so a 400-row list made its own row 6,000px tall
     and dragged the chart with it.

     Taking the content out of flow with `position:absolute` is what actually
     works — an absolutely-positioned child contributes nothing to layout, so
     the row is sized purely by its other card and the list scrolls inside
     whatever that turns out to be. `min-height` is the floor for when there is
     no other card, which is every card once the grid collapses to one column
     below 1080px. */
  .card .body.fill { position: relative; min-height: 260px; padding: 0; }
  .card .body.fill > * { position: absolute; inset: 14px; }
  .card .body.fill > .scroll { overflow-y: auto; max-height: none; }
  .card .body.fill > .duo { overflow: hidden; }
  .card .body.fill .duo-box { min-height: 0; }
  .card .body.fill .duo-box > .scroll { flex: 1; min-height: 0; max-height: none; }

  /* ---------- drilldown: every-month axis ---------- */
  /* Rendered as HTML under the chart rather than as SVG <text>. The charts use
     preserveAspectRatio="none", which scales x and y differently — anything
     drawn inside gets squashed horizontally as the card narrows, which is
     survivable for six labels and unreadable for twenty-four. */
  /* Two horizontal lines rather than one rotated one. At 24 buckets a single
     line of "Aug '26" doesn't fit the slot, and rotating it makes the axis
     hard to read; stacking the month over the year keeps every label upright
     and halves the width it needs. */
  .xaxis { display: grid; margin-top: 6px; }
  .xaxis span {
    font-size: 9px; line-height: 1.2; color: var(--muted);
    justify-self: center; text-align: center; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .xaxis .yr { display: block; opacity: .7; }

  /* ---------- draft / status pills ---------- */
  .pill {
    display: inline-block; border-radius: 10px; padding: 0 7px;
    font-size: 11px; border: 1px solid var(--border); white-space: nowrap;
  }
  .pill.draft { color: var(--muted); }
  .pill.ready { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .pill.unknown { color: var(--muted); border-style: dashed; }
  .pill.merged { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, var(--border)); }
  .pill.dropped { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
  .pill.pass { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .pill.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  .pill.neutral { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }

  /* ---------- a select living in a card header ---------- */
  /* Sized to read as a caption rather than as a form field — it sits where the
     descriptive text sits on every other card. */
  select.inline-sel {
    padding: 2px 6px; font-size: 12px; color: var(--muted);
    max-width: 260px;
  }
  select.inline-sel:hover { color: var(--text); border-color: var(--accent); }

  /* ---------- dream panel: exclusion popup ----------
     Two searchable checklists. The row is an explicit two-column grid — a
     checkbox track and a name track — rather than a flex row: the name has to
     be given its own column that can't be collapsed by the checkbox, and
     `minmax(0, 1fr)` is what stops a long label from either overflowing the
     popup or squeezing itself to nothing. */
  .excl-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; }
  .excl-pop {
    /* Overrides combo-pop's min-width/max-height/overflow: the columns scroll
       here, not the popup, so the search boxes stay put while you scroll. */
    width: min(620px, calc(100vw - 60px));
    min-width: 0;
    max-height: min(460px, 70vh);
    padding: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .excl-head {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 12px;
  }
  .excl-head .ghost { margin-left: auto; flex: none; }
  .excl-head .ghost[disabled] { opacity: .45; cursor: default; }

  .excl-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .excl-cols { grid-template-columns: 1fr; } }
  .excl-group {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    padding-top: 10px;
  }
  .excl-group + .excl-group { border-left: 1px solid var(--border); }
  .excl-group h4 {
    flex: none; margin: 0; padding: 0 12px 7px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted);
    display: flex; align-items: baseline; gap: 8px;
  }
  .excl-group h4 .n { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  /* The global `input[type="search"]` rule sets a 260px floor, which is right
     for the toolbar and twice too wide for half of this popup. Qualified with
     .excl-pop so it wins on specificity rather than on source order. */
  .excl-pop input[type="search"] {
    width: 100%; min-width: 0;
    padding: 4px 8px; font-size: 12px;
  }
  .excl-search { flex: none; padding: 0 12px 8px; }
  .excl-list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-bottom: 8px; }

  .excl-opt {
    display: grid; grid-template-columns: 15px minmax(0, 1fr);
    align-items: center; gap: 9px;
    padding: 5px 12px; cursor: pointer;
    font-size: 12px; color: var(--text);
  }
  .excl-opt:hover { background: var(--panel-2); }
  .excl-opt input[type="checkbox"] {
    width: 15px; height: 15px; margin: 0; accent-color: var(--accent);
  }
  .excl-opt .nm {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text);
  }
  /* What's currently hidden should be findable without reading every row. */
  .excl-opt.on .nm { color: var(--accent); }
  .excl-sep {
    padding: 8px 12px 4px; margin-top: 2px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
  }

  .picker { padding: 40px 0; text-align: center; }
  .picker h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .picker p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .picker .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 720px; margin: 0 auto; }
  .picker .chips button {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px;
    color: var(--text); padding: 5px 13px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .picker .chips button:hover { border-color: var(--accent); color: var(--accent); }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; font-size: 13px; }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <span class="mark">NH</span>
    <span class="name">NH Dashboard</span>
    <button class="icon-btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.78 3.22a.75.75 0 0 1 0 1.06L6.06 8l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/><path d="M12.25 2.5a.75.75 0 0 1 .75.75v9.5a.75.75 0 0 1-1.5 0v-9.5a.75.75 0 0 1 .75-.75Z"/></svg>
    </button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="side-foot">
    <a id="refresh" target="_blank" rel="noopener" title="Opens the build workflow — 'Run workflow' there rebuilds the data">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.36-.63A6.5 6.5 0 1 1 8 1.5v1.5Z"/><path d="M8 .5 11 3 8 5.5V.5Z"/></svg>
      <span>Refresh data</span>
    </a>
    <button id="theme" title="Switch theme">
      <svg id="themeIcon" viewBox="0 0 16 16" fill="currentColor"></svg>
      <span id="themeLabel">Light mode</span>
    </button>
  </div>
</aside>

<main>
  <div class="topbar">
    <h1 id="pageTitle">…</h1>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="content">
    <div class="toolbar" id="toolbar"></div>
    <div id="view"></div>
  </div>
</main>

<script type="module">
/* ==========================================================================
   State
   ========================================================================== */

const state = {
  data: null,
  page: "analytics",
  module: null,       // null = the page's overview grid
  // One period control per page, in the same shape the drilldowns use: it
  // scopes the KPI tiles and the charts together. There used to be two — a
  // window dropdown for the aggregates and a separate range picker for the
  // chart's x-axis — which put two time controls on one toolbar answering
  // subtly different questions about the same page.
  window: "m3",
  gran: "month",      // x-axis granularity: day | week | month
  filter: "",
  label: null,
  minActivity: 3,
  sort: null,
  dir: -1,

  // ---- Dream Panel ----
  // Repos and labels to hide from every card on that page. Some labels mean
  // "this is not yours to merge" and some repos are somebody else's problem;
  // either way they're noise on a page whose whole job is a short actionable
  // list. Held as arrays rather than Sets so they serialize to localStorage.
  dreamExcl: { repos: [], labels: [] },
  exclOpen: false,
  exclQ: { repos: "", labels: "" },   // search text, per group

  // ---- drilldown ----
  // Its own window, independent of the analytics/people one. Looking at a
  // single subject you almost always want their whole history first and then
  // narrow; looking at the org you want the recent picture. Sharing one
  // setting made each page wrong half the time.
  drillWindow: "all",
  closedState: "all", // Closed PRs tab: all | merged | dropped
  subject: null,      // selected login or repo name; null = nothing picked yet
  drill: null,        // contents of drilldown.json, fetched on first visit
  drillState: "idle", // idle | loading | ready | error
  drillError: null,
  combo: { q: "", open: false, active: 0 },
};

/**
 * Drilldown page id -> the key its subjects live under in drilldown.json.
 * Membership in this map is also what marks a page as a drilldown page, which
 * is what the router keys off to expect a subject segment in the hash.
 */
const DRILL = { contributor: "contributors", repo: "repos" };
const isDrill = (page) => Object.hasOwn(DRILL, page);
const otherMode = (page) => (page === "contributor" ? "repo" : "contributor");

/** Closed PRs toggle. Key order is the order the buttons appear in. */
const CLOSED_LABEL = { all: "All", merged: "Merged", dropped: "Closed" };

/**
 * x-axis granularity. `bucketDays` is what turns a period in days into a bucket
 * count when slicing a series.
 */
const GRANS = [
  { id: "day",   label: "by day",   bucketDays: 1 },
  { id: "week",  label: "by week",  bucketDays: 7 },
  { id: "month", label: "by month", bucketDays: 30.4 },
];

/** Defaults for the Dream Panel exclusions, applied on a first visit. */
const DREAM_EXCL_DEFAULT = {
  repos: ["Angelica"],
  labels: ["⚠️ AUTHOR MERGE ONLY"],
};

/* ==========================================================================
   Formatting helpers
   ========================================================================== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/**
 * A contributor's name, linking to their drilldown rather than to GitHub.
 *
 * The drilldown carries more of what you're after when you click a name in
 * this dashboard, and it has a "View on GitHub" button of its own, so nothing
 * is lost. A real anchor rather than a button, so middle-click and
 * open-in-new-tab keep working; the view's click handler intercepts plain
 * clicks to reset sort/filter and leaves modified clicks to the browser.
 *
 * Declared up here with the other formatters because module-scope consts like
 * `byLogin` reference it at initialization time.
 */
const contribHref = (r) => `#contributor/${encodeURIComponent(r.login)}`;
const contribLink = (login) =>
  `<a href="${contribHref({ login })}" data-drilllink>${esc(login)}</a>`;
const fmt = n => (n == null ? "—" : Number(n).toLocaleString());
const pctFmt = x => (x == null ? "—" : `${Math.round(x * 100)}%`);

/** Hours read badly past a day or two, so switch units rather than print 412h. */
function dur(hours) {
  if (hours == null) return "—";
  if (hours < 1) return `${Math.round(hours * 60)}m`;
  if (hours < 48) return `${hours < 10 ? hours.toFixed(1) : Math.round(hours)}h`;
  const d = hours / 24;
  return d < 60 ? `${d < 10 ? d.toFixed(1) : Math.round(d)}d` : `${Math.round(d / 30)}mo`;
}

/** Bare text — for places that do their own styling, like the search popup. */
function agoText(days) {
  if (days == null) return "—";
  return days === 0 ? "today" : days === 1 ? "1 day ago" : days < 60 ? `${days} days ago`
    : days < 730 ? `${Math.floor(days / 30)} mo ago` : `${Math.floor(days / 365)} yr ago`;
}

function age(days) {
  if (days == null) return "—";
  const cls = days > 180 ? "age-ancient" : days > 60 ? "age-old" : "";
  return `<span class="${cls} num">${agoText(days)}</span>`;
}

const daysSince = iso => (iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : null);

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/**
 * Bucket keys are 2026-08 / 2026-W32 / 2026-08-10; none reads well on an axis
 * as-is. Split into the period and its year so an axis can stack them on two
 * lines and a tooltip can join them back into one.
 */
function bucketParts(b) {
  if (b.includes("W")) {
    const [y, w] = b.split("-W");
    return { period: `w${Number(w)}`, year: y };
  }
  const [y, m, d] = b.split("-");
  return {
    period: d ? `${MONTHS[Number(m) - 1]} ${Number(d)}` : MONTHS[Number(m) - 1],
    year: y,
  };
}

function bucketLabel(b) {
  const { period, year } = bucketParts(b);
  return `${period} '${year.slice(2)}`;
}

/* ==========================================================================
   Chart primitives — hand-rolled SVG, so the page stays dependency-free
   ========================================================================== */

const NICE = [1, 2, 2.5, 5, 10];
function niceMax(v) {
  if (!v) return 1;
  const mag = 10 ** Math.floor(Math.log10(v));
  return (NICE.find(n => v <= n * mag) ?? 10) * mag;
}

/**
 * Shared scaffold: y grid lines + labels, x labels thinned to ~6 ticks.
 * Returns the plot geometry so each chart type only has to draw its marks.
 */
function plotFrame(buckets, max, { height, padL = 38, padB = 22, padT = 6, everyLabel = false }) {
  const W = 1000, H = height;
  const innerW = W - padL - 6, innerH = H - padB - padT;
  const top = niceMax(max);
  const y = v => padT + innerH - (v / top) * innerH;

  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => top * f);
  const gridSvg = ticks.map(t => `
    <line class="grid-line" x1="${padL}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" opacity="${t === 0 ? 1 : .45}"/>
    <text class="axis" x="${padL - 7}" y="${y(t) + 3}" text-anchor="end">${t >= 1000 ? `${Math.round(t / 1000)}k` : Math.round(t * 10) / 10}</text>`).join("");

  // Label roughly six evenly-spaced buckets, anchored on the newest one so the
  // right-hand edge is always dated. When everyLabel is set the labels move
  // out of the SVG entirely — see xAxis() — so nothing is drawn here.
  const every = Math.max(1, Math.ceil(buckets.length / 6));
  const xLabels = everyLabel ? "" : buckets.map((b, i) =>
    (buckets.length - 1 - i) % every === 0
      ? `<text class="axis" x="${padL + (innerW / buckets.length) * (i + 0.5)}" y="${H - 6}" text-anchor="middle">${esc(bucketLabel(b.b))}</text>`
      : ""
  ).join("");

  return { W, H, padL, padT, innerW, innerH, top, y, gridSvg, xLabels };
}

/**
 * Every bucket labelled, as HTML beneath the plot.
 *
 * Inset to match the plot area so label i sits under bar i. The percentages
 * come from the same geometry plotFrame uses, so the two can't drift.
 */
function xAxis(buckets, { padL = 38, W = 1000, padR = 6 } = {}) {
  if (!buckets.length) return "";
  const left = (padL / W) * 100;
  const width = ((W - padR - padL) / W) * 100;
  return `<div class="xaxis" style="margin-left:${left}%;width:${width}%;grid-template-columns:repeat(${buckets.length},1fr)">${
    buckets.map(b => {
      const { period, year } = bucketParts(b.b);
      return `<span>${esc(period)}<span class="yr">${esc(year)}</span></span>`;
    }).join("")}</div>`;
}

/** Grouped vertical bars. `series` = [{ key, label, color }]. */
function barChart(buckets, series, { height = 190, everyLabel = false } = {}) {
  if (!buckets.length) return `<div class="empty">No data in this range.</div>`;
  const max = Math.max(1, ...buckets.flatMap(b => series.map(s => b[s.key] ?? 0)));
  const f = plotFrame(buckets, max, { height, everyLabel });
  const slot = f.innerW / buckets.length;
  const bw = Math.max(1, (slot * 0.74) / series.length);

  const bars = buckets.map((b, i) => {
    const x0 = f.padL + slot * i + slot * 0.13;
    return series.map((s, j) => {
      const v = b[s.key] ?? 0;
      const h = Math.max(v > 0 ? 1 : 0, f.padT + f.innerH - f.y(v));
      return `<rect x="${x0 + bw * j}" y="${f.y(v)}" width="${bw}" height="${h}" fill="${s.color}" rx="1"/>`;
    }).join("");
  }).join("");

  const hover = buckets.map((b, i) => `
    <rect class="hoverzone" x="${f.padL + slot * i}" y="${f.padT}" width="${slot}" height="${f.innerH}" fill="transparent">
      <title>${esc(bucketLabel(b.b))}\n${series.map(s => `${s.label}: ${fmt(b[s.key] ?? 0)}`).join("\n")}</title>
    </rect>`).join("");

  return `<svg class="chart" viewBox="0 0 ${f.W} ${f.H}" preserveAspectRatio="none" height="${height}">
    ${f.gridSvg}${bars}${hover}${f.xLabels}</svg>` + (everyLabel ? xAxis(buckets) : "");
}

/** Multi-series line chart. Nulls break the line rather than dropping to zero. */
function lineChart(buckets, series, { height = 190, fmtV = fmt, everyLabel = false } = {}) {
  if (!buckets.length) return `<div class="empty">No data in this range.</div>`;
  const max = Math.max(1, ...buckets.flatMap(b => series.map(s => b[s.key] ?? 0)));
  const f = plotFrame(buckets, max, { height, everyLabel });
  const slot = f.innerW / buckets.length;
  const px = i => f.padL + slot * (i + 0.5);

  const paths = series.map(s => {
    let d = "", pen = false;
    buckets.forEach((b, i) => {
      const v = b[s.key];
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${px(i).toFixed(1)},${f.y(v).toFixed(1)}`;
      pen = true;
    });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }).join("");

  const hover = buckets.map((b, i) => `
    <rect class="hoverzone" x="${f.padL + slot * i}" y="${f.padT}" width="${slot}" height="${f.innerH}" fill="transparent">
      <title>${esc(bucketLabel(b.b))}\n${series.map(s => `${s.label}: ${b[s.key] == null ? "—" : fmtV(b[s.key])}`).join("\n")}</title>
    </rect>`).join("");

  return `<svg class="chart" viewBox="0 0 ${f.W} ${f.H}" preserveAspectRatio="none" height="${height}">
    ${f.gridSvg}${paths}${hover}${f.xLabels}</svg>` + (everyLabel ? xAxis(buckets) : "");
}

function legend(series) {
  return `<div class="legend">${series.map(s =>
    `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;
}

/** Horizontal ranked bars — better than a pie for "top N of many". */
function hbars(rows, { label, value, color = "var(--accent)", href = null, internal = false, fmtV = fmt } = {}) {
  if (!rows.length) return `<div class="empty">Nothing to show.</div>`;
  const max = Math.max(...rows.map(value));
  // `internal` links stay in the app (a #hash route), so they must not open in
  // a new tab the way the github.com links do.
  const attrs = internal ? " data-drilllink" : ` target="_blank" rel="noopener"`;
  return `<div class="hbars">${rows.map(r => {
    const text = esc(label(r));
    return `<div class="hbar">
      <span class="lab" title="${text}">${href ? `<a href="${href(r)}"${attrs}>${text}</a>` : text}</span>
      <span class="track"><span class="fill" style="width:${(value(r) / max) * 100}%;background:${color}"></span></span>
      <span class="val">${fmtV(value(r))}</span>
    </div>`;
  }).join("")}</div>`;
}

function kpi(k, v, d = "", cls = "") {
  return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v ${cls}">${v}</div><div class="d">${d}</div></div>`;
}

/* ==========================================================================
   Shared table rendering
   ========================================================================== */

const COLUMNS = {
  pr: [
    { key: "repo",      label: "Repo",   render: r => `<span class="repo">${esc(r.repo)}</span>` },
    { key: "title",     label: "Title",  render: r => `<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="repo">#${r.number}</span>` },
    { key: "author",    label: "Author", render: r => esc(r.author) },
    { key: "labels",    label: "Labels", sortable: false, render: r => r.labels.map(l => `<span class="label" style="border-color:#${l.color}">${esc(l.name)}</span>`).join("") },
    { key: "ageDays",   label: "Opened", render: r => age(r.ageDays) },
    { key: "staleDays", label: "Updated",render: r => age(r.staleDays) },
  ],
  release: [
    { key: "repo",             label: "Repo",          render: r => `<a href="${r.repoUrl}" target="_blank" rel="noopener">${esc(r.repo)}</a>` },
    { key: "tagName",          label: "Last release",  render: r => `<a href="${r.releaseUrl}" target="_blank" rel="noopener">${esc(r.tagName)}</a>${r.isPrerelease ? ' <span class="label">pre</span>' : ""}` },
    { key: "commitsAhead",     label: "Commits ahead", render: r => `<span class="num">${r.commitsAhead ?? "?"}</span>` },
    { key: "daysSinceRelease", label: "Released",      render: r => age(r.daysSinceRelease) },
    { key: "defaultBranch",    label: "Branch",        render: r => `<span class="repo">${esc(r.defaultBranch)}</span>` },
  ],
};

/** Compact column subset for overview previews — six columns don't fit a card. */
const preview = cols => cols.filter(c => ["repo", "title", "tagName", "commitsAhead", "ageDays", "login"].includes(c.key));

function renderTable(rows, cols, { sortable = false, limit = null, total = null } = {}) {
  if (!rows.length) return `<div class="empty">Nothing here. That's usually good news.</div>`;
  const shown = limit ? rows.slice(0, limit) : rows;
  const head = cols.map(c =>
    `<th ${sortable && c.sortable !== false ? `data-sort="${c.key}"` : ""}>${c.label}${
      sortable && state.sort === c.key ? (state.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = shown.map(r => `<tr>${cols.map(c => `<td>${c.render(r)}</td>`).join("")}</tr>`).join("");
  const rest = (total ?? rows.length) - shown.length;
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` +
    (rest > 0 ? `<div class="more">+ ${fmt(rest)} more — open the tab for the full list.</div>` : "");
}

function sortRows(rows, cols) {
  if (!state.sort) return rows;
  const col = cols.find(c => c.key === state.sort);
  const val = col?.get ?? (r => r[state.sort]);
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    const cmp = typeof x === "number" && typeof y === "number"
      ? x - y : String(x ?? "").localeCompare(String(y ?? ""));
    return cmp * state.dir;
  });
}

function applyFilter(rows) {
  if (!state.filter) return rows;
  const q = state.filter.toLowerCase();
  return rows.filter(r =>
    [r.repo, r.title, r.author, r.tagName, r.login].some(v => String(v ?? "").toLowerCase().includes(q)));
}

/* ==========================================================================
   Data accessors
   ========================================================================== */

const panel = id => state.data?.panels?.[id];
const A = () => panel("analytics")?.ok ? panel("analytics").data : null;
const W = () => A()?.byWindow?.[state.window] ?? null;

/** Drilldowns keep their own window, independent of the org pages. */
const activeWindow = () => (isDrill(state.page) ? state.drillWindow : state.window);

/**
 * The window list for whichever page is showing.
 *
 * Order matters: a drilldown must read its own file's list, because
 * dashboard.json and drilldown.json are built separately and can disagree
 * about which windows exist. When they do — say a rebuild adds 2y and 5y —
 * offering the analytics list on a drilldown would hide options the drilldown
 * data actually has, and offering the drilldown list on Analytics would offer
 * ones it doesn't.
 */
const windowList = () =>
  (isDrill(state.page) ? state.drill?.windows : null)
  ?? A()?.windows ?? state.drill?.windows
  ?? panel("contributors")?.data?.windows ?? [];

const windowLabel = () => {
  const id = activeWindow();
  return windowList().find(w => w.id === id)?.label ?? id;
};

/** "last 3 months" or "all time" — "last all time" reads like a typo. */
const windowPhrase = () => {
  const l = windowLabel().toLowerCase();
  return l === "all time" ? "all time" : `last ${l}`;
};

/** How many days the selected period covers; null for all time. */
const windowDays = () =>
  windowList().find(w => w.id === activeWindow())?.days ?? null;

/**
 * Time series for the selected granularity, trimmed to the selected period.
 *
 * One control drives both now, so this reads the same window the KPI tiles do
 * rather than a second lookback of its own.
 */
function seriesSlice() {
  const a = A();
  if (!a) return [];
  const all = a.series[state.gran] ?? [];
  const days = windowDays();
  if (days == null) return all;
  const per = GRANS.find(g => g.id === state.gran)?.bucketDays ?? 30.4;
  return all.slice(-Math.ceil(days / per));
}

/**
 * Set when the period reaches further back than the daily buckets go.
 *
 * The build only emits two years of days (see DAY_SERIES_DAYS) — an all-time
 * daily series is 4,300 buckets of unreadable chart in a file that's committed
 * on every build. Saying so is better than silently drawing a two-year chart
 * under a control that says "5 years".
 */
function dayLimitNote() {
  if (state.gran !== "day") return "";
  const from = A()?.series?.dayFrom;
  if (!from) return "";
  const days = windowDays();
  if (days != null && Date.now() - days * 86400000 >= new Date(from).getTime())
    return "";
  return `<div class="hint" style="margin-top:10px">Daily buckets only go back to ${esc(from)} — the chart is showing everything there is, which is less than the selected period. Switch to weekly for the full span.</div>`;
}

/**
 * Delta against the equal-length period immediately before the selected
 * window — a 3-month view compares to the 3 months before it, not to last
 * month. The comparison period is precomputed in the analytics panel.
 *
 *   invert: lower is better (latency, unapproved merges)
 *   pp:     the metric is already a share, so report points, not % of a %
 */
function delta(key, { invert = false, pp = false, fallback = "" } = {}) {
  const w = W();
  const prev = w?.prev?.[key];
  const cur = w?.[key];
  if (cur == null || prev == null || (!pp && !prev)) return fallback;

  const diff = pp ? cur - prev : (cur - prev) / prev;
  const flat = Math.abs(diff) < (pp ? 0.005 : 0.02);
  const good = invert ? diff < 0 : diff > 0;
  const cls = flat ? "flat" : good ? "up" : "down";
  const arrow = flat ? "•" : diff > 0 ? "▲" : "▼";
  const n = Math.abs(Math.round(diff * 100));
  const size = pp ? `${n} pt${n === 1 ? "" : "s"}` : `${n}%`;

  return `<span class="${cls}">${arrow} ${size}</span> vs. ${esc(w.prevLabel ?? "previous period")}`;
}

/* ==========================================================================
   Drilldown data
   --------------------------------------------------------------------------
   drilldown.json is ~2.5 MB and only these two pages need it, so it's fetched
   the first time you land on one and kept for the rest of the session. The
   other three pages never pay for it.
   ========================================================================== */

async function ensureDrilldown() {
  if (state.drillState !== "idle") return;
  state.drillState = "loading";
  render();
  try {
    // The build names the file in dashboard.json rather than the page
    // hardcoding it, so renaming it later can't leave the two out of sync.
    const file = state.data?.panels?.drilldown?.file ?? "drilldown.json";
    const res = await fetch(`data/${file}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.drill = await res.json();
    state.drillState = "ready";
  } catch (err) {
    state.drillState = "error";
    // A build-time failure explains the problem far better than "HTTP 404"
    // does, so prefer it when the panel recorded one.
    state.drillError = state.data?.panels?.drilldown?.error ?? err.message;
  }
  render();
}

const drillKey = () => DRILL[state.page];
const subjectList = () => state.drill?.index?.[drillKey()] ?? [];
const subject = () => state.drill?.[drillKey()]?.[state.subject] ?? null;

/** Absent windows mean "nothing happened", which is what a zeroed one says. */
const EMPTY_WINDOW = {
  opened: 0, merged: 0, closed: 0, approvals: 0,
  mergeRate: null, approvedShare: null, unapprovedMerges: 0,
  medianMergeHours: null, p90MergeHours: null, medianFirstReviewHours: null,
  people: 0, reviewers: 0,
};
const SW = () => subject()?.windows?.[activeWindow()] ?? EMPTY_WINDOW;

/**
 * Expand the column-oriented series the build emits back into the named
 * objects the chart helpers expect. Memoized onto the record — a subject's
 * series is re-read on every render, and re-expanding 24 rows each time for a
 * page that also draws three charts adds up.
 */
function subjectSeries() {
  const s = subject();
  if (!s?.series?.from) return [];
  if (s._series) return s._series;

  const fields = state.drill.seriesFields;
  const [y, m] = s.series.from.split("-").map(Number);
  s._series = s.series.v.map((row, i) => {
    const d = new Date(Date.UTC(y, m - 1 + i, 1));
    const out = { b: `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}` };
    // null rows are months the subject existed through but did nothing in.
    fields.forEach((f, j) => { out[f] = row ? row[j] : 0; });
    return out;
  });
  return s._series;
}

/**
 * The contributor's merged and closed PRs, newest first.
 *
 * Stored packed (positional rows, repo names interned per contributor) because
 * there are 25,660 of them org-wide; expanded on first use and memoized onto
 * the record, the same deal as the series.
 */
function resolvedAll() {
  const s = subject();
  if (!s?.resolved) return [];
  if (s._resolved) return s._resolved;
  const { repos, rows } = s.resolved;
  s._resolved = rows.map(([r, number, at, merged]) => ({
    repo: repos[r], number, at, merged: merged === 1,
  }));
  return s._resolved;
}

/** Filtered by the merged/closed toggle and the window picker. */
function resolvedRows() {
  const days = (state.drill?.windows ?? []).find(w => w.id === activeWindow())?.days;
  const cutoff = days == null ? null : Date.now() - days * 86400000;
  return resolvedAll().filter(r => {
    if (state.closedState === "merged" && !r.merged) return false;
    if (state.closedState === "dropped" && r.merged) return false;
    return cutoff == null || new Date(r.at).getTime() >= cutoff;
  });
}

/**
 * Series trimmed to the selected window.
 *
 * The drilldowns used to carry a second control for this, which meant two time
 * pickers on one toolbar answering slightly different questions. Now the
 * window scopes the charts and the numbers together.
 */
function subjectSlice() {
  const all = subjectSeries();
  const days = (state.drill?.windows ?? []).find(w => w.id === activeWindow())?.days;
  // Monthly buckets, so a 1-month window is a single bar. Honest, if sparse.
  return days == null ? all : all.slice(-Math.max(1, Math.ceil(days / 30.4)));
}

/**
 * Two ranked lists in side-by-side boxes. Each scrolls independently, so a
 * 400-entry list and a 3-entry one sit next to each other without either
 * dictating the height of the card.
 */
function duo(left, right, { height = "tall", stacked = false } = {}) {
  const box = ({ title, rows, color, href, internal, label, value }) => `
    <section class="duo-box">
      <h3>${esc(title)}<span class="n">${fmt(rows.length)}</span></h3>
      <div class="scroll ${height}">${
        rows.length
          ? hbars(rows, { label, value, color, href, internal })
          : `<div class="empty" style="padding:18px 0">Nothing here.</div>`
      }</div>
    </section>`;
  return `<div class="duo${stacked ? " stacked" : ""}">${box(left)}${box(right)}</div>`;
}

const byLogin = { label: r => r.login, value: r => r.count,
  href: contribHref, internal: true };

/** URL for whatever the current page's subjects are on GitHub. */
const subjectUrl = (id) =>
  state.page === "contributor"
    ? `https://github.com/${encodeURIComponent(id)}`
    : `https://github.com/${state.data.org}/${encodeURIComponent(id)}`;

    render() {

      const cells = a.heatmap.map((row, d) =>
        `<span class="rl">${days[d]}</span>` + row.map((v, h) =>

/* ---- draft status -------------------------------------------------------
   Tri-state. Records ingested before `isDraft` was added to the query carry
   null, which has to look different from "not a draft" — otherwise the column
   silently claims every old PR is ready for review. */

const draftPill = (v) =>
  v == null
    ? `<span class="pill unknown" title="Not ingested yet — run npm run ingest to backfill">unknown</span>`
    : v
      ? `<span class="pill draft">draft</span>`
      : `<span class="pill ready">ready</span>`;

/** Sort order: drafts, then ready, then unknown. */
const draftOrder = (v) => (v === true ? 0 : v === false ? 1 : 2);

const draftNotice = (backlog) =>
  backlog.draftsKnown ? "" :
    `<div class="hint" style="padding:12px 14px 0">Draft status is missing for PRs ingested before it was tracked. Run <code>npm run ingest</code> — it re-fetches just the open ones.</div>`;

/* ---- CI health ---------------------------------------------------------- */

/**
 * CI runs are minutes-scale, and `dur()` takes hours — round-tripping 4.5
 * minutes through it yields "5m", quietly throwing away the precision that
 * makes two workflows comparable. Format minutes directly and hand off to
 * dur() only once we're past an hour, where its unit-switching earns its keep.
 */
const ciDur = (m) =>
  m == null ? "—" : m < 60 ? `${m < 10 ? m.toFixed(1) : Math.round(m)}m` : dur(m / 60);

const CI_TONE = {
  success: "pass",
  failure: "fail", timed_out: "fail", startup_failure: "fail",
  cancelled: "neutral", skipped: "neutral", action_required: "neutral",
};

/**
 * Default-branch Actions health. Lives in dashboard.json rather than the
 * drilldown file because it's API-derived rather than store-derived, and it's
 * small enough that the split costs nothing.
 */
function ciSection(repo) {
  const p = panel("ciHealth");
  if (!p) return "";  // built before this panel existed
  if (!p.ok)
    return `<div class="hint" style="margin-top:18px">CI health unavailable — ${esc(p.error)}</div>`;

  const ci = p.data[repo];
  if (!ci)
    return `<div class="hint" style="margin-top:18px">No completed Actions runs on this repo's default branch.</div>`;

  const c = ci.latest?.conclusion;
  const tone = CI_TONE[c] ?? "neutral";
  const badge = ci.latest
    ? `<a href="${ci.latest.url}" target="_blank" rel="noopener" class="pill ${tone}" style="font-size:12px">${esc(c ?? "unknown")}</a>`
    : `<span class="pill unknown">no verdict</span>`;

  const rate = ci.passRate;
  const rateCls = rate == null ? "" : rate > 0.9 ? "up" : rate > 0.7 ? "flat" : "down";

  return `<h3 style="font-size:13px;margin:22px 0 8px">CI on ${esc(ci.defaultBranch)}</h3>
    <div class="kpis" style="margin:0 -14px">
      ${kpi("Latest run", badge, ci.latest?.workflow ? esc(ci.latest.workflow) : "")}
      ${kpi("Pass rate", pctFmt(rate), `${fmt(ci.decisive)} decisive of ${fmt(ci.runs)} runs`, rateCls)}
      ${kpi("Median duration", ciDur(ci.medianMinutes), `${fmt(ci.failures)} failed`)}
      ${kpi("Actions time", ciDur(ci.totalMinutes),
            ci.timedRuns ? `across ${fmt(ci.timedRuns)} runs` : "no timing data")}
    </div>
    <div class="hint" style="margin-top:12px">Cancelled and skipped runs are excluded from the pass rate — they say something about the humans, not the code.</div>
    <div class="hint" style="margin-top:6px"><strong>Actions time is wall-clock, not GitHub's billable minutes.</strong> A run with eight matrix jobs in parallel bills roughly eight times what it took on the clock, and macOS bills 10x. Use it to compare repos against each other, not against an invoice — the real figure needs one API request per run, which would cost more than the rest of this dashboard combined.</div>`;
}

/** Cross-reference into the needsRelease panel, which already has this data. */
function releaseFor(repo) {
  const p = panel("needsRelease");
  return p?.ok ? p.data.find(r => r.repo === repo) ?? null : null;
}

/** Every window side by side — the expanded form of both Profile modules. */
function windowTable(rows) {
  const ws = state.drill?.windows ?? [];
  const s = subject();
  const at = id => s.windows[id] ?? EMPTY_WINDOW;
  return `<table>
    <thead><tr><th style="cursor:default">Metric</th>${ws.map(x =>
      `<th style="cursor:default" class="num">${esc(x.label)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([lab, f]) =>
      `<tr><td>${lab}</td>${ws.map(x => `<td class="num">${f(at(x.id))}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
}
