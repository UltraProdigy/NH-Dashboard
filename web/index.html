<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://github.com https://avatars.githubusercontent.com; connect-src 'self' http://localhost:8787; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH Dashboard</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/sidebar.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/cards.css">
<link rel="stylesheet" href="styles/tables.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/drilldown.css">
<link rel="stylesheet" href="styles/pills.css">
<link rel="stylesheet" href="styles/dream.css">
<link rel="stylesheet" href="styles/find.css">
<link rel="stylesheet" href="styles/labels.css">
<link rel="stylesheet" href="styles/logs.css">
<link rel="stylesheet" href="styles/overview.css">
<!-- Last, so its breakpoint rules win over the ones they undo without needing
     to out-specify them. -->
<link rel="stylesheet" href="styles/mobile.css">
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <img class="mark" src="assets/logo.png" alt="New Horizons">
    <span class="name">NH Dashboard</span>
    <button class="icon-btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.78 3.22a.75.75 0 0 1 0 1.06L6.06 8l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/><path d="M12.25 2.5a.75.75 0 0 1 .75.75v9.5a.75.75 0 0 1-1.5 0v-9.5a.75.75 0 0 1 .75-.75Z"/></svg>
    </button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="side-foot">
    <button id="theme" title="Switch theme">
      <svg id="themeIcon" viewBox="0 0 16 16" fill="currentColor"></svg>
      <span id="themeLabel">Light mode</span>
    </button>
    <a id="logout" href="/cdn-cgi/access/logout" title="Sign out of the dashboard">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 4.5-1.97-1.97a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.97-1.97H6.75a.75.75 0 0 1 0-1.5Z"/></svg>
      <span>Sign out</span>
    </a>
  </div>
</aside>

<main>
  <div class="topbar">
    <button class="icon-btn navbtn" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.25h13a.75.75 0 0 1 0 1.5h-13a.75.75 0 0 1 0-1.5Zm0 4h13a.75.75 0 0 1 0 1.5h-13a.75.75 0 0 1 0-1.5Zm0 4h13a.75.75 0 0 1 0 1.5h-13a.75.75 0 0 1 0-1.5Z"/></svg>
    </button>
    <h1 id="pageTitle">…</h1>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="content">
    <div class="toolbar" id="toolbar"></div>
    <div id="view"></div>
  </div>
</main>

<!-- Only ever visible with the sidebar open as a drawer: a tap anywhere off
     the menu is how everyone closes one. -->
<div class="scrim" id="scrim" hidden></div>

<div id="popLayer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
