name: Build and deploy dashboard

on:
  # Manual only for now, plus a rebuild whenever code lands on main.
  #
  # The scheduled run is parked rather than deleted — uncomment to bring it
  # back. Cost was never the reason to stop: Actions is free on public repos
  # and the build is ~50 API requests. The reason is that every run commits
  # `data/`, so 48 runs a day grow the repo whether or not anyone is reading
  # the dashboard.
  #
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
      - "documentation.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Incremental — repos with no pushes since the last run are skipped
      # entirely, so this is fast despite covering all-time history. The store
      # is committed to the repo, so the checkout above already has it.
      - name: Ingest PRs and reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GH_DASHBOARD_TOKEN }}
          GITHUB_ORG: GTNewHorizons
        run: node src/ingest.js

      - name: Build data
        env:
          # NOT the built-in secrets.GITHUB_TOKEN — that one is scoped to this
          # repo only and cannot read GTNewHorizons. Add a PAT with
          # "public_repo" scope as a repo secret named GH_DASHBOARD_TOKEN:
          # Settings → Secrets and variables → Actions → New repository secret
          GITHUB_TOKEN: ${{ secrets.GH_DASHBOARD_TOKEN }}
          GITHUB_ORG: GTNewHorizons
        run: node src/build.js --no-cache

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update dashboard data [skip ci]"
            git push
          fi

      # Stage the site: index.html at the root, data/ beside it. The frontend
      # fetches "data/dashboard.json" relatively, so this layout works both
      # here and under `npm run serve` locally.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
